services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_container
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app                # ← ソースコード
      - ./wait-for-db.sh:/wait-for-db.sh  # ← wait-for-db.sh をルートにマウント
    working_dir: /app
    depends_on:
      - db
    command: ["/bin/sh", "-c", "chmod +x /wait-for-db.sh && /wait-for-db.sh db uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  db:
    image: postgres:15
    container_name: postgres_container
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_container
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host"]
    depends_on:
      - backend

volumes:
  postgres_data:
